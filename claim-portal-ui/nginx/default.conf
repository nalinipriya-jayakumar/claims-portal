# Edge for the claim portal: static SPA plus a narrow reverse proxy to the Claims API.

# Keep the caller's X-Request-Id only if it is safe to log (same rule as the API); otherwise use
# Nginx's own 32-hex request ID. Either way the API receives one and echoes it back.
map $http_x_request_id $correlation_id {
    "~^[A-Za-z0-9-]{1,64}$" $http_x_request_id;
    default                 $request_id;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Docker's embedded DNS. With a variable in proxy_pass, Nginx re-resolves the name (every 10 s)
    # instead of keeping the address from startup, so a restarted API container is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $claims_api http://claims-api:8080;

    # Only the claims API is reachable; Actuator and anything else on the backend are not proxied.
    location /api/ {
        client_max_body_size 64k;
        proxy_pass $claims_api;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $correlation_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hashed build assets never change, so browsers may cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Single-page app: unknown paths serve index.html, which is always revalidated.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}

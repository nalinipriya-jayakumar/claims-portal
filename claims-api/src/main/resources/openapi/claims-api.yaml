openapi: 3.1.0
info:
  title: Claims API
  version: 1.0.0
  summary: Home insurance first notice of loss (FNOL) submission.
  description: |
    Accepts a home insurance claim, validates it, assigns a unique claim number and
    records a `ClaimSubmitted` event for asynchronous email notification.

    **Behaviour notes**
    - A `201` response means the claim is persisted. The confirmation email is sent
      asynchronously by the Notification Service and is not part of this response.
    - The server is the source of truth for validation. Client-side checks are for
      user experience only.
    - Error responses follow RFC 9457 (`application/problem+json`). Field errors never
      echo submitted values, to keep personal information out of responses and logs.
    - There is no read endpoint in v1. Without customer authentication, a lookup by
      sequential claim number would allow claim enumeration.
  contact:
    name: Nalini Priya Jayakumar
  license:
    name: Proprietary, candidate technical challenge
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:3000
    description: Local, through the Nginx edge (recommended; same origin as the portal)
  - url: http://localhost:8080
    description: Local, direct to the Claims API (development and testing only)
security: []   # v1 is an anonymous public FNOL form; see description
tags:
  - name: Claims
    description: Claim submission

paths:
  /api/v1/claims:
    post:
      tags: [Claims]
      operationId: submitClaim
      summary: Submit a new home insurance claim
      description: |
        Validates the submission, generates a claim number (`CLM-YYYY-NNNNNN`), saves the
        claim and an outbox event in one transaction, and returns the claim number.
        Validation errors are reported together, one per field. Errors detected while reading
        the JSON itself (unknown field, value outside an enum, unparseable date) stop at the
        first one.

        **Duplicate submissions:** v1 has no idempotency key; the portal disables the submit
        button while a request is in flight. An `Idempotency-Key` header (FR-18, a "Could") is a
        documented production improvement.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimSubmissionRequest'
            examples:
              waterDamage:
                summary: Valid water damage claim
                value:
                  customer:
                    firstName: Jane
                    lastName: O'Neil
                    email: jane.oneil@example.com
                    phone: '2045550142'
                  policyNumber: HO-12345678
                  dateOfLoss: '2026-10-15'
                  lossType: WATER
                  propertyAddress:
                    street: 123 Main Street
                    city: Winnipeg
                    province: MB
                    postalCode: R3C 1A1
                  description: Pipe burst in the basement overnight and flooded the laundry room.
                  consentAcknowledged: true
      responses:
        '201':
          description: Claim accepted and persisted. Confirmation email will follow.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimSubmissionResponse'
              examples:
                accepted:
                  value:
                    claimNumber: CLM-2026-000123
                    status: SUBMITTED
                    submittedAt: '2026-10-18T20:05:22Z'
                    message: Your claim has been received. A confirmation email will be sent to you shortly.
        '400':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Correlation ID. Set by the Nginx edge if absent; generated by the API if still absent.
        Propagated to the event and to Notification Service logs. Only values of 1-64 letters,
        digits and hyphens are kept; anything else is replaced by a new ID rather than rejected,
        because it is a tracing aid, not part of the claim.
      schema:
        type: string

  headers:
    RequestId:
      description: Correlation ID for this request; quote it when reporting a problem.
      schema:
        type: string

  schemas:
    ClaimSubmissionRequest:
      type: object
      additionalProperties: false
      required:
        - customer
        - policyNumber
        - dateOfLoss
        - lossType
        - propertyAddress
        - description
        - consentAcknowledged
      properties:
        customer:
          $ref: '#/components/schemas/Customer'
        policyNumber:
          type: string
          description: Policy number. Format is an assumption for this exercise and is configurable; not verified against a policy system in v1.
          pattern: '^HO-[0-9]{8}$'
          examples: [HO-12345678]
        dateOfLoss:
          type: string
          format: date
          description: |
            Date the loss occurred (ISO 8601, America/Winnipeg calendar date).
            Business rules enforced by the server: not in the future, and not more than
            365 days before the submission date (configurable).
          examples: ['2026-10-15']
        lossType:
          $ref: '#/components/schemas/LossType'
        propertyAddress:
          $ref: '#/components/schemas/Address'
        description:
          type: string
          minLength: 20
          maxLength: 2000
          description: What happened, in the customer's words. Plain text; HTML is escaped on output.
        consentAcknowledged:
          type: boolean
          description: |
            Customer agrees to be contacted about the claim and to the privacy notice.
            Must be `true`; `false` is reported as a field error with code `MUST_BE_TRUE`.
            (Stated here rather than as `const: true`, so that `false` produces that field error
            instead of failing to parse the request.)

    Customer:
      type: object
      additionalProperties: false
      required: [firstName, lastName, email]
      properties:
        firstName:
          $ref: '#/components/schemas/PersonName'
        lastName:
          $ref: '#/components/schemas/PersonName'
        email:
          type: string
          format: email
          maxLength: 254
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          description: Confirmation email is sent here. Stored lower-cased.
        phone:
          type: string
          pattern: '^[2-9][0-9]{2}[2-9][0-9]{6}$'
          description: Optional. 10-digit North American number, digits only (the portal strips formatting).
          examples: ['2045550142']

    PersonName:
      type: string
      minLength: 1
      maxLength: 50
      pattern: "^[A-Za-zÀ-ÖØ-öø-ÿ][A-Za-zÀ-ÖØ-öø-ÿ' -]*$"
      description: Letters, spaces, apostrophes and hyphens. Leading and trailing spaces are trimmed.

    Address:
      type: object
      additionalProperties: false
      required: [street, city, province, postalCode]
      properties:
        street:
          type: string
          minLength: 1
          maxLength: 100
        city:
          type: string
          minLength: 1
          maxLength: 60
        province:
          $ref: '#/components/schemas/Province'
        postalCode:
          type: string
          pattern: '^[A-Za-z][0-9][A-Za-z] ?[0-9][A-Za-z][0-9]$'
          description: Canadian postal code. Normalized to upper case with one space (R3C 1A1).

    LossType:
      type: string
      enum: [FIRE, WATER, WIND_HAIL, THEFT, VANDALISM, OTHER]

    Province:
      type: string
      description: Canadian province or territory code.
      # Quoted: unquoted ON is the boolean true in YAML, which would drop Ontario from the contract.
      enum: ["AB", "BC", "MB", "NB", "NL", "NS", "NT", "NU", "ON", "PE", "QC", "SK", "YT"]

    ClaimStatus:
      type: string
      enum: [SUBMITTED]
      description: Only SUBMITTED exists in v1; later statuses belong to adjudication, which is out of scope.

    ClaimSubmissionResponse:
      type: object
      required: [claimNumber, status, submittedAt]
      properties:
        claimNumber:
          type: string
          pattern: '^CLM-[0-9]{4}-[0-9]{6}$'
          examples: [CLM-2026-000123]
        status:
          $ref: '#/components/schemas/ClaimStatus'
        submittedAt:
          type: string
          format: date-time
          description: UTC timestamp.
        message:
          type: string
          description: Customer-facing confirmation text.

    ProblemDetail:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        correlationId:
          type: string
          description: Same value as the `X-Request-Id` response header.

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: JSON path of the field, dot-separated (e.g. `propertyAddress.postalCode`).
        code:
          type: string
          description: Stable machine-readable code the portal maps to its own wording.
          enum: [REQUIRED, INVALID_FORMAT, TOO_SHORT, TOO_LONG, NOT_ALLOWED_VALUE, DATE_IN_FUTURE, DATE_TOO_OLD, MUST_BE_TRUE, UNKNOWN_FIELD]
        message:
          type: string
          description: Human-readable message. Never includes the submitted value.

  responses:
    ValidationError:
      description: The submission failed validation. Nothing was saved or published.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            invalidFields:
              value:
                type: /problems/validation-error
                title: Invalid claim submission
                status: 400
                detail: 2 fields need attention.
                instance: /api/v1/claims
                correlationId: 7c4f0a2e-1b9d-4e61-a3f2-0d5e8c9b7a10
                errors:
                  - field: dateOfLoss
                    code: DATE_IN_FUTURE
                    message: Date of loss cannot be in the future.
                  - field: propertyAddress.postalCode
                    code: INVALID_FORMAT
                    message: Enter a postal code like R3C 1A1.
            malformedJson:
              value:
                type: /problems/malformed-request
                title: Request body could not be read
                status: 400
                instance: /api/v1/claims
                correlationId: 7c4f0a2e-1b9d-4e61-a3f2-0d5e8c9b7a11
                errors:
                  - field: $
                    code: INVALID_FORMAT
                    message: Request body is not valid JSON.
    PayloadTooLarge:
      description: Request body exceeds 64 KB.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnsupportedMediaType:
      description: Content-Type must be application/json.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalError:
      description: Unexpected error. The response contains no stack trace or internal detail.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: /problems/internal-error
            title: Something went wrong
            status: 500
            detail: Please try again. If the problem continues, contact us and quote the reference below.
            correlationId: 7c4f0a2e-1b9d-4e61-a3f2-0d5e8c9b7a13
